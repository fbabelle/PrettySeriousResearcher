[project]
name = "pretty-serious-researcher"
version = "0.2.0"
description = "A 16-skill research-paper pipeline for coding agents (Claude Code, Cursor, and any SKILL.md-aware tool), with a cross-tool installer."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "fbabelle" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["claude-code", "skills", "research", "academic-writing", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/fbabelle/PrettySeriousResearcher"
Repository = "https://github.com/fbabelle/PrettySeriousResearcher"

[project.scripts]
research-skills = "install_skills:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel ships the installer module plus the skill set and the two tracking
# templates as package data, so `uvx --from git+… research-skills` works with no
# clone. install_skills.py resolves this layout when its repo layout is absent.
[tool.hatch.build.targets.wheel]
only-include = ["install_skills.py"]

[tool.hatch.build.targets.wheel.force-include]
".claude/skills" = "install_skills_data/skills"
"docs/tracking/state.json" = "install_skills_data/tracking/state.json"
"docs/tracking/cost.json" = "install_skills_data/tracking/cost.json"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
